<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 巴蘭騎驢:驢(馱著巴蘭)面向右,迎著只有牠看得見的天使剪影+發亮的刀,深藍底 -->
  <defs>
    <linearGradient id="bg" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1f2b" />
      <stop offset="100%" stop-color="#153d56" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <!-- 天使(右側,白袍+雙翼+光環+拔出來的刀,發光) -->
  <g>
    <circle cx="392" cy="252" r="100" fill="#fff6d8" opacity="0.14" />
    <ellipse cx="350" cy="238" rx="26" ry="72" transform="rotate(18 350 238)" fill="#eef4ff" opacity="0.9" />
    <ellipse cx="434" cy="238" rx="26" ry="72" transform="rotate(-18 434 238)" fill="#eef4ff" opacity="0.9" />
    <path d="M392 176 Q366 252 356 356 L428 356 Q418 252 392 176 Z" fill="#f5f2e8" />
    <circle cx="392" cy="150" r="24" fill="#f5f2e8" />
    <circle cx="392" cy="116" r="15" fill="none" stroke="#ffd76a" stroke-width="6" />
    <!-- 手裡拔出來的刀(金白,發光) -->
    <g transform="rotate(26 338 160)">
      <rect x="328" y="96" width="20" height="124" rx="9" fill="#ffe9a0" opacity="0.5" />
      <rect x="333" y="100" width="10" height="114" rx="4" fill="#fff3c4" />
      <rect x="318" y="214" width="40" height="9" rx="4" fill="#d9a94a" />
    </g>
  </g>
  <!-- 驢(左側,面向右;背上土黃袍的巴蘭) -->
  <g transform="translate(-36 116) scale(0.68)">
    <!-- 巴蘭(土黃袍+頭巾) -->
    <g fill="#c8a45a">
      <rect x="238" y="164" width="52" height="86" rx="16" />
      <circle cx="264" cy="140" r="22" />
    </g>
    <path d="M240 132 A26 26 0 0 1 288 132 L288 144 L240 144 Z" fill="#e2d0a4" />
    <!-- 驢身(灰褐) -->
    <g fill="#cbbba6">
      <path d="M166 268 Q136 300 150 342" stroke="#cbbba6" stroke-width="13" fill="none" stroke-linecap="round" />
      <rect x="160" y="248" width="192" height="98" rx="44" />
      <rect x="184" y="318" width="27" height="94" rx="11" />
      <rect x="234" y="324" width="27" height="90" rx="11" />
      <rect x="284" y="324" width="27" height="90" rx="11" />
      <rect x="322" y="318" width="27" height="94" rx="11" />
      <path d="M336 278 L372 200 L412 212 L402 290 Z" />
      <rect x="366" y="176" width="94" height="54" rx="26" />
      <ellipse cx="382" cy="142" rx="13" ry="40" transform="rotate(-18 382 142)" />
      <ellipse cx="414" cy="140" rx="13" ry="40" transform="rotate(14 414 140)" />
    </g>
    <!-- 鞍布 -->
    <rect x="216" y="238" width="96" height="26" rx="10" fill="#8a6a3a" />
    <!-- 眼睛(看見天使的眼) -->
    <circle cx="438" cy="198" r="8" fill="#1b2733" />
  </g>
</svg>
